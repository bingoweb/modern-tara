name: release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs; the token reaches only the `gh` step.
permissions: {}

jobs:
  # Builds without any write permission; the zips and their SHA-256 lines
  # leave the job as a workflow artifact.
  build:
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: modern-tara.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe: modern-tara
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.100 --profile minimal --target "$TARGET"
          rustup default 1.100
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      # Layout of the zip: the executable next to js/ (without node_modules),
      # rules/, ps/, scripts/, sgconfig.yml, tools.toml and LICENSE.
      - name: Stage
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'js') | Out-Null
          Copy-Item -LiteralPath "target/$env:TARGET/release/$env:EXE" -Destination $stage
          Get-ChildItem -LiteralPath js -File | Copy-Item -Destination (Join-Path $stage 'js')
          foreach ($d in 'rules', 'ps', 'scripts') { Copy-Item -LiteralPath $d -Destination (Join-Path $stage $d) -Recurse }
          foreach ($f in 'sgconfig.yml', 'tools.toml', 'LICENSE') { Copy-Item -LiteralPath $f -Destination $stage }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'stage' '*') -DestinationPath "dist/modern-tara-$env:TARGET.zip"
      - name: Zip (Linux, keeps the executable bit)
        if: runner.os == 'Linux'
        shell: bash
        run: (cd "$RUNNER_TEMP/stage" && zip -q -r -X "$GITHUB_WORKSPACE/dist/modern-tara-$TARGET.zip" .)
      - name: SHA-256 line
        shell: bash
        run: (cd dist && sha256sum "modern-tara-$TARGET.zip" > "modern-tara-$TARGET.zip.sha256" && cat "modern-tara-$TARGET.zip.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modern-tara-${{ matrix.target }}
          path: |
            dist/modern-tara-${{ matrix.target }}.zip
            dist/modern-tara-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # No build here: checks the artifacts, attests them, publishes the release.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: modern-tara-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          cat modern-tara-*.zip.sha256 > SHA256SUMS
          rm modern-tara-*.zip.sha256
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/modern-tara-*.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/modern-tara-*.zip dist/SHA256SUMS